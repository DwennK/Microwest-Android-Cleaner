[project]
name = "microwest-android-cleaner"
version = "0.1.0"
description = "Portable Android app metadata scanner for repair-shop triage."
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.11.1,<7",
    "python-dotenv>=1.2.2,<2",
    "openai>=2.47.0,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
